<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pumeon Productions — Find Your Package</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght=0,300;0,400;0,500;1,400&family=DM+Sans:wght=300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f6f8;
  --surface:#fff;
  --border:rgba(61,90,107,0.13);
  --border-hover:rgba(61,90,107,0.28);
  --text-primary:#1a2f3d;
  --text-secondary:#486070;
  --text-tertiary:#8aaabb;
  --accent:#3d5a6b;
  --accent-fg:#fff;
  --mint:#4ecba0;
  --mint-light:#e6f9f2;
  --orange:#f0a055;
  --orange-light:#fef3e8;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:20px;
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text-primary);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:2.5rem 1.5rem 6rem;
  font-size:16px;
}
.card{
  background:var(--surface);
  border:.5px solid var(--border);
  border-radius:var(--radius-lg);
  width:100%;
  max-width:680px;
  overflow:hidden;
  box-shadow:0 12px 60px rgba(61,90,107,.12);
}
.qhdr{
  text-align:center;
  padding:3rem 2.5rem 2rem;
  border-bottom:.5px solid var(--border);
  background:linear-gradient(160deg,#eaf3f7 0%,#f8fafb 60%,#fff 100%);
  position:relative;
  overflow:hidden;
}
.qhdr::before{
  content:'';
  position:absolute;
  top:-50px;
  right:-50px;
  width:200px;
  height:200px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(78,203,160,.12) 0%,transparent 70%);
  pointer-events:none;
}
.logo-wrap{
  margin-bottom:1.2rem;
}
.logo-wrap svg, .logo-wrap img{
  height:70px;
  width:auto;
  filter:drop-shadow(0 4px 16px rgba(61,90,107,.15));
}
.brand{
  font-size:11px;
  font-weight:600;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--mint);
  margin-bottom:.5rem;
}
.qtitle{
  font-family:'Cormorant Garamond',serif;
  font-size:34px;
  font-weight:400;
  line-height:1.2;
  color:var(--text-primary);
}
.qsub{
  font-size:14px;
  color:var(--text-tertiary);
  margin-top:.6rem;
}
.prog-wrap{
  height:4px;
  background:var(--border);
}
.prog-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--mint));
  transition:width .55s cubic-bezier(.4,0,.2,1);
  width:0%;
}
.prog-label{
  font-size:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 2rem 0;
  min-height:32px;
}
.motivator{
  color:var(--mint);
  font-weight:600;
  font-size:12px;
}
.pct{
  font-size:11px;
  color:var(--text-tertiary);
}
.step{
  padding:2.5rem;
  animation:fadeUp .38s ease both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
.slabel{
  font-size:11px;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--text-tertiary);
  margin-bottom:.7rem;
}
.sq{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:400;
  margin-bottom:.5rem;
  line-height:1.3;
}
.shint{
  font-size:14px;
  color:var(--text-secondary);
  margin-bottom:1.8rem;
  line-height:1.7;
}
.ogrid{
  display:grid;
  gap:12px;
}
.obtn{
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px 20px;
  background:var(--surface);
  border:1.5px solid var(--border-hover);
  border-radius:var(--radius-md);
  cursor:pointer;
  text-align:left;
  transition:border-color .18s,background .18s,box-shadow .18s,transform .12s;
  width:100%;
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  color:var(--text-primary);
}
.obtn:hover{
  border-color:var(--mint);
  background:var(--mint-light);
  box-shadow:0 3px 14px rgba(78,203,160,.15);
  transform:translateY(-1px);
}
.obtn.sel{
  border:2px solid var(--accent);
  background:#edf3f7;
  box-shadow:0 3px 14px rgba(61,90,107,.12);
}
.omark{
  width:26px;
  height:26px;
  border-radius:50%;
  border:2px solid var(--border-hover);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  color:var(--accent-fg);
  transition:background .18s,border .18s;
}
.obtn.sel .omark{
  background:var(--mint);
  border-color:var(--mint);
}
.otxt strong{
  display:block;
  font-weight:500;
  font-size:15px;
}
.otxt span{
  font-size:13px;
  color:var(--text-secondary);
  margin-top:2px;
  display:block;
}
.obtn-badge{
  margin-left:auto;
  flex-shrink:0;
  font-size:11px;
  font-weight:600;
  padding:4px 12px;
  border-radius:20px;
  background:var(--orange-light);
  color:#9a5500;
  border:1px solid rgba(240,160,85,.3);
}
.name-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.field-wrap{
  margin-bottom:1.2rem;
}
.field-wrap label{
  display:block;
  font-size:13px;
  color:var(--text-secondary);
  margin-bottom:8px;
  font-weight:500;
}
.field-input{
  width:100%;
  padding:14px 16px;
  border:1.5px solid var(--border-hover);
  border-radius:var(--radius-md);
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  color:var(--text-primary);
  background:var(--surface);
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field-input:focus{
  border-color:var(--mint);
  box-shadow:0 0 0 4px rgba(78,203,160,.15);
}
.field-privacy{
  font-size:12px;
  color:var(--text-tertiary);
  margin-top:.6rem;
}
.avail-msg{
  font-size:13px;
  border-radius:var(--radius-md);
  padding:12px 16px;
  margin-top:-.6rem;
  margin-bottom:1.2rem;
  font-weight:500;
  line-height:1.5;
}
.avail-msg.peak,.avail-msg.high{
  background:var(--orange-light);
  color:#8a4d00;
  border:1px solid rgba(240,160,85,.3);
}
.avail-msg.spring,.avail-msg.offpeak{
  background:var(--mint-light);
  color:#1a5c42;
  border:1px solid rgba(78,203,160,.3);
}
.navrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:2rem;
}
.bbk{
  background:none;
  border:none;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  color:var(--text-secondary);
  cursor:pointer;
  padding:10px 0;
}
.bbk:hover{
  color:var(--text-primary);
}
.bnxt{
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  font-weight:600;
  padding:14px 32px;
  background:var(--accent);
  color:var(--accent-fg);
  border:none;
  border-radius:var(--radius-md);
  cursor:pointer;
  transition:opacity .2s,box-shadow .2s,transform .12s;
  box-shadow:0 4px 14px rgba(61,90,107,.25);
}
.bnxt:disabled{
  opacity:.28;
  cursor:default;
  box-shadow:none;
}
.bnxt:not(:disabled):hover{
  opacity:.88;
  box-shadow:0 6px 20px rgba(61,90,107,.32);
  transform:translateY(-1px);
}
.info-callout{
  background:var(--mint-light);
  border:1px solid rgba(78,203,160,.3);
  border-radius:var(--radius-md);
  padding:13px 16px;
  font-size:13px;
  color:#1a5c42;
  margin-bottom:1.5rem;
  line-height:1.65;
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.urgency-banner{
  background:var(--orange-light);
  border:1px solid rgba(240,160,85,.35);
  border-radius:var(--radius-md);
  padding:13px 16px;
  font-size:13px;
  color:#8a4d00;
  margin-bottom:1.4rem;
  display:flex;
  align-items:flex-start;
  gap:10px;
  line-height:1.6;
}
.loading-wrap{
  padding:4rem 2.5rem;
  text-align:center;
  animation:fadeUp .3s ease both;
}
.loading-logo svg, .loading-logo img{
  height:60px;
  width:auto;
  margin-bottom:1.6rem;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.7;transform:scale(.96)}
}
.loading-text{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;
  font-weight:400;
  margin-bottom:1.4rem;
  color:var(--text-primary);
}
.loading-bar-wrap{
  height:5px;
  background:var(--border);
  border-radius:5px;
  overflow:hidden;
  margin:0 auto 1.2rem;
  max-width:300px;
}
.loading-bar{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--mint));
  border-radius:5px;
  width:0%;
  transition:width .1s linear;
}
.loading-sub{
  font-size:14px;
  color:var(--text-tertiary);
}
.rwrap{
  padding:2.5rem 2.5rem 3rem;
  animation:fadeUp .45s ease both;
}
.reyebrow{
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--mint);
  margin-bottom:.5rem;
  font-weight:600;
}
.rhead{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;
  font-weight:400;
  margin-bottom:.5rem;
  line-height:1.25;
}
.rtag{
  font-size:14px;
  color:var(--text-secondary);
  margin-bottom:1.8rem;
  line-height:1.7;
}
.price-estimate{
  background:#fff;
  border:2px solid var(--accent);
  border-radius:var(--radius-md);
  padding:20px 24px;
  margin-bottom:1.6rem;
  text-align:center;
}
.pe-label{
  display:block;
  font-size:11px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--mint);
  margin-bottom:6px;
}
.pe-amount{
  display:block;
  font-family:'Cormorant Garamond',serif;
  font-size:42px;
  font-weight:400;
  color:var(--accent);
  margin-bottom:4px;
}
.pe-note{
  display:block;
  font-size:12px;
  color:var(--text-secondary);
}
.summary-strip{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:1.8rem;
}
.sum-pill{
  font-size:12px;
  padding:5px 14px;
  border-radius:20px;
  border:1px solid var(--border-hover);
  color:var(--text-secondary);
  background:#f4f8fa;
}
.sum-pill.highlight{
  background:var(--mint-light);
  border-color:rgba(78,203,160,.4);
  color:#1a5c42;
  font-weight:500;
}
.testimonial{
  background:var(--mint-light);
  border-left:4px solid var(--mint);
  border-radius:0 var(--radius-md) var(--radius-md) 0;
  padding:16px 20px;
  margin-bottom:1.6rem;
}
.tst-stars{
  color:var(--orange);
  font-size:15px;
  margin-bottom:6px;
}
.tst-text{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;
  font-weight:400;
  line-height:1.6;
  color:var(--text-primary);
  font-style:italic;
  margin-bottom:8px;
}
.tst-author{
  font-size:13px;
  color:var(--text-secondary);
}
.trust-block{
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:18px 20px;
  margin-bottom:1.6rem;
  background:#f8fbfc;
}
.trust-title{
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-secondary);
  margin-bottom:14px;
}
.trust-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.trust-item{
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:13px;
  color:var(--text-secondary);
  line-height:1.5;
}
.trust-icon{
  font-size:18px;
  flex-shrink:0;
  margin-top:-2px;
}
.pkcard{
  border:1.5px solid var(--border-hover);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin-bottom:.8rem;
  cursor:pointer;
  transition:border-color .2s,transform .15s,box-shadow .2s;
  text-decoration:none;
  display:block;
  color:inherit;
}
.pkcard:hover{
  border-color:var(--mint);
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(78,203,160,.18);
}
.pkcard.rec{
  border:2.5px solid var(--accent);
}
.pkcard.rec:hover{
  border-color:var(--mint);
  box-shadow:0 10px 32px rgba(78,203,160,.22);
}
.pkhdr{
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  background:#fff;
}
.pkcard.rec .pkhdr{
  background:#edf3f7;
}
.rbadge{
  font-size:11px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  background:var(--mint);
  color:#fff;
  padding:4px 12px;
  border-radius:20px;
  white-space:nowrap;
  flex-shrink:0;
}
.pkname{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;
  font-weight:500;
  margin-bottom:4px;
  color:var(--text-primary);
  line-height:1.2;
}
.pkprice{
  font-size:15px;
  font-weight:600;
  color:var(--accent);
  margin-top:2px;
}
.pksubtag{
  font-size:12px;
  color:var(--text-tertiary);
  margin-top:2px;
}
.pkbody{
  padding:18px 24px;
}
.pkinc{
  font-size:13px;
  color:var(--text-secondary);
  line-height:2;
  list-style:none;
}
.pkinc li{
  padding-left:16px;
  position:relative;
}
.pkinc li::before{
  content:'';
  position:absolute;
  left:0;
  top:12px;
  width:7px;
  height:2px;
  background:var(--mint);
}
.pkbest{
  font-size:12px;
  color:var(--text-tertiary);
  margin-top:10px;
  font-style:italic;
}
.pk-cta-hint{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:600;
  color:var(--accent);
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--border);
  transition:all .25s;
}
.cocktail-note{
  font-size:12px;
  color:#1a5c42;
  background:var(--mint-light);
  margin-top:10px;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  line-height:1.6;
}
.peak-note{
  font-size:12px;
  color:#8a4d00;
  background:var(--orange-light);
  margin-top:8px;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  line-height:1.6;
  border:1px solid rgba(240,160,85,.25);
}
.compare-btn{
  display:block;
  width:100%;
  margin:.6rem 0 1.2rem;
  padding:12px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  color:var(--accent);
  background:none;
  border:1.5px dashed var(--border-hover);
  border-radius:var(--radius-md);
  cursor:pointer;
  transition:background .2s,border-color .2s;
  text-align:center;
}
.compare-btn:hover{
  background:var(--mint-light);
  border-color:var(--mint);
}
.social-strip{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:1.4rem;
  flex-wrap:wrap;
  padding:18px 20px;
  background:linear-gradient(135deg,#eaf3f7,var(--mint-light));
  border-radius:var(--radius-md);
  border:1px solid rgba(78,203,160,.2);
}
.social-strip p{
  font-size:13px;
  color:var(--text-secondary);
  width:100%;
  text-align:center;
  margin-bottom:4px;
}
.social-link{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  padding:10px 20px;
  border-radius:var(--radius-md);
  transition:opacity .2s,transform .15s;
}
.social-link:hover{
  opacity:.85;
  transform:translateY(-1px);
}
.social-link.web{
  background:var(--accent);
  color:#fff;
}
.social-link.ig{
  background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  color:#fff;
}
.save-box{
  border:1px solid var(--border-hover);
  border-radius:var(--radius-md);
  padding:18px 20px;
  margin-bottom:1.2rem;
  background:#f8fbfc;
}
.save-box-title{
  font-size:14px;
  font-weight:600;
  margin-bottom:4px;
  color:var(--text-primary);
}
.save-box-sub{
  font-size:12px;
  color:var(--text-secondary);
  margin-bottom:12px;
}
.save-row{
  display:flex;
  gap:10px;
}
.save-input{
  flex:1;
  padding:12px 14px;
  border:1.5px solid var(--border-hover);
  border-radius:var(--radius-md);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  color:var(--text-primary);
  background:var(--surface);
  outline:none;
}
.save-input:focus{
  border-color:var(--mint);
}
.save-btn{
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:12px 20px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:var(--radius-md);
  cursor:pointer;
  white-space:nowrap;
  transition:opacity .2s;
}
.save-btn:hover{
  opacity:.85;
}
.save-success{
  font-size:13px;
  color:#1a7a4a;
  margin-top:8px;
  display:none;
}
.hold-box{
  border:1px solid rgba(240,160,85,.35);
  border-radius:var(--radius-md);
  padding:18px 20px;
  margin-bottom:1.4rem;
  background:var(--orange-light);
}
.hold-title{
  font-size:14px;
  font-weight:600;
  margin-bottom:4px;
  color:#8a4d00;
}
.hold-sub{
  font-size:12px;
  color:#8a4d00;
  margin-bottom:12px;
  line-height:1.6}
.hold-btn{
  display:inline-block;
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:11px 22px;
  background:#8a4d00;
  color:#fff;
  border-radius:var(--radius-md);
  text-decoration:none;
  transition:opacity .2s;
}
.hold-btn:hover{
  opacity:.85;
}
.notes{
  font-size:12px;
  color:var(--text-secondary);
  line-height:2;
  border-top:.5px solid var(--border);
  padding-top:16px;
  margin-bottom:1.4rem;
}
.notes strong{
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  display:block;
  margin-bottom:8px;
  color:var(--text-primary);
  font-weight:600;
}
.brst{
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  padding:10px 20px;
  background:none;
  border:1px solid var(--border-hover);
  border-radius:var(--radius-md);
  cursor:pointer;
  color:var(--text-secondary);
  transition:background .2s;
  margin-top:1.2rem;
  display:inline-block;
}
.brst:hover{
  background:#f2f6f8;
  color:var(--text-primary);
}
.ty-wrap{
  padding:4rem 2.5rem;
  text-align:center;
  animation:fadeUp .4s ease both;
}
.ty-icon{
  width:70px;
  height:70px;
  border-radius:50%;
  background:var(--mint-light);
  border:2.5px solid var(--mint);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 1.4rem;
  font-size:30px;
}
.ty-head{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;
  font-weight:400;
  margin-bottom:.6rem;
}
.ty-sub{
  font-size:15px;
  color:var(--text-secondary);
  line-height:1.7;
  margin-bottom:2rem;
  max-width:400px;
  margin-left:auto;
  margin-right:auto;
}
.ty-step{
  background:#f2f7fa;
  border-radius:var(--radius-md);
  padding:14px 18px;
  margin-bottom:10px;
  font-size:14px;
  color:var(--text-secondary);
  text-align:left;
  display:flex;
  align-items:center;
  gap:14px;
}
.ty-num{
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--mint);
  color:#fff;
  font-size:13px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.ty-actions{
  margin-top:2rem;
  display:flex;
  flex-direction:column;
  gap:12px;
  align-items:center;
}
.ty-cal{
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  font-weight:600;
  padding:14px 32px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:var(--radius-md);
  cursor:pointer;
  text-decoration:none;
  transition:opacity .2s;
  display:inline-block;
  box-shadow:0 4px 14px rgba(61,90,107,.25);
}
.ty-cal:hover{
  opacity:.88;
}
.ty-social{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
}
.back-results-btn{
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  font-weight:600;
  padding:12px 26px;
  background:none;
  border:2px solid var(--accent);
  color:var(--accent);
  border-radius:var(--radius-md);
  cursor:pointer;
  transition:background .2s;
  display:inline-block;
}
.back-results-btn:hover{
  background:var(--mint-light);
  border-color:var(--mint);
  color:var(--mint);
}
.ty-restart{
  font-size:13px;
  color:var(--text-tertiary);
  background:none;
  border:none;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  margin-top:4px;
}
.ty-restart:hover{
  color:var(--text-primary);
}

@media(max-width:640px){
  body{padding:0;background:var(--surface)}
  .card{border-radius:0;border:none;max-width:100%;box-shadow:none}
  .qhdr{padding:2.2rem 1.5rem 1.6rem}
  .logo-wrap svg, .logo-wrap img{height:60px}
  .qtitle{font-size:28px}
  .step,.rwrap,.ty-wrap,.loading-wrap{padding:1.8rem 1.5rem}
  .sq{font-size:24px}
  .obtn{padding:14px 16px;font-size:14px}
  .otxt strong{font-size:14px}.otxt span{font-size:12px}
  .omark{width:24px;height:24px}
  .bnxt{width:100%;text-align:center;padding:16px;font-size:16px}
  .navrow{flex-direction:column-reverse;gap:12px;align-items:stretch}
  .bbk{text-align:center;padding:10px;font-size:14px}
  .name-row{grid-template-columns:1fr}
  .field-input{font-size:16px;padding:15px 16px}
  .save-row{flex-direction:column}
  .social-strip{flex-direction:column}
  .trust-grid{grid-template-columns:1fr}
  .pe-amount{font-size:34px}
  .rhead{font-size:26px}
  .pkname{font-size:22px}
  .pkprice{font-size:14px}
  .pkhdr{padding:16px 18px}
  .pkbody{padding:16px 18px}
  .pk-cta-hint{font-size:13px}
  .ty-head{font-size:28px}
  .ty-cal{width:100%;text-align:center;padding:16px}
  .back-results-btn{width:100%;text-align:center}
  .prog-label{padding:8px 1.5rem 0}
}
</style>
</head>
<body>
<div class="card">
  <div class="qhdr" id="quiz-header">
    <div class="brand">Pumeon Productions</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="40" fill="#3d5a6b" />
        <path d="M35 35 L65 50 L35 65 Z" fill="#4ecba0"/>
      </svg>
    </div>
    <div class="qtitle" id="hdr-title">Find Your Package</div>
    <div class="qsub" id="hdr-sub">Take our 60-second matching quiz</div>
  </div>

  <div id="quiz-progress-section">
    <div class="prog-wrap"><div class="prog-fill" id="pbar"></div></div>
    <div class="prog-label">
      <span class="motivator" id="pmotivate">Let's get started!</span>
      <span class="pct" id="ppct">0% Complete</span>
    </div>
  </div>

  <div id="step-view"></div>
</div>

<script>
// Quiz Configuration Constants
const WEBSITE = "https://pumeon.net";
const INSTAGRAM = "https://instagram.com/pumeon";
const BOOKING_URL = "https://calendly.com";

// Quiz State Model
let currentStep = 0;
let selections = {
  type: "",
  hours: "",
  date: "",
  venue: "",
  firstName: "",
  lastName: "",
  email: "",
  phone: ""
};

// Steps Content Configuration Database
const stepsData = [
  {
    label: "Step 1 of 4",
    title: "What event format are we planning?",
    hint: "Select the primary scope of coverage needed.",
    options: [
      { key: "wedding", title: "Full Wedding Production", label: "Complete ceremony & reception coverage" },
      { key: "engagement", title: "Engagement Session Only", label: "Dedicated portrait or creative session" },
      { key: "corporate", title: "Corporate / Commercial Event", label: "High-end brand or conference coverage" }
    ]
  },
  {
    label: "Step 2 of 4",
    title: "How many hours of active coverage do you expect?",
    hint: "Don't worry, you can always scale this up or down later.",
    options: [
      { key: "4hr", title: "4 Hours (Intimate / Micro Event)", label: "Perfect for elopements or short formats" },
      { key: "8hr", title: "8 Hours (Standard Coverage)", label: "Captures preparation through first dance" },
      { key: "12hr", title: "12 Hours (Comprehensive Production)", label: "Full story format from dusk till dawn" }
    ]
  },
  {
    label: "Step 3 of 4",
    title: "What is your target timeline?",
    hint: "This allows us to calibrate local seasonal package rates.",
    options: [
      { key: "spring", title: "Spring / Early Summer", label: "Peak season window" },
      { key: "fall", title: "Autumn / Peak Color Window", label: "High-demand date calendar" },
      { key: "offpeak", title: "Winter / Off-Peak Cycle", label: "Special off-season considerations apply" }
    ]
  },
  {
    label: "Step 4 of 4",
    title: "Where can we send your package dashboard?",
    hint: "Enter your contact configuration to instantly compile results.",
    isForm: true
  }
];

// SVG Icon Helpers
function iconGlobe() { return '<svg style="width:14px;height:14px;fill:currentColor;margin-right:4px;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.53c-.26-.81-1-1.4-1.9-1.4h-1v-3c0-.55-.45-1-1-1h-6v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'; }
function iconIG() { return '<svg style="width:14px;height:14px;fill:currentColor;margin-right:4px;" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>'; }

// Mount View Lifecycle Controller
function renderCurrentStep() {
  const container = document.getElementById('step-view');
  
  // Progress Computations
  const totalSteps = stepsData.length;
  const pctValue = Math.round((currentStep / totalSteps) * 100);
  document.getElementById('pbar').style.width = pctValue + "%";
  document.getElementById('ppct').innerText = pctValue + "% Complete";
  
  // Progress Motivational Headings Toggle
  if (pctValue < 30) document.getElementById('pmotivate').innerText = "Let's find your fit!";
  else if (pctValue < 60) document.getElementById('pmotivate').innerText = "Awesome, custom scaling options generated!";
  else if (pctValue < 90) document.getElementById('pmotivate').innerText = "Almost there! Checking calendar slots...";
  else document.getElementById('pmotivate').innerText = "Final Step!";

  const data = stepsData[currentStep];

  // Logic Router for Form UI Template vs Button Grid Template
  if (data.isForm) {
    container.innerHTML = `
      <div class="step">
        <div class="slabel">${data.label}</div>
        <div class="sq">${data.title}</div>
        <div class="shint">${data.hint}</div>
        
        <div class="name-row">
          <div class="field-wrap">
            <label>First Name</label>
            <input type="text" class="field-input" id="f-fname" value="${selections.firstName}" placeholder="Tony">
          </div>
          <div class="field-wrap">
            <label>Last Name</label>
            <input type="text" class="field-input" id="f-lname" value="${selections.lastName}" placeholder="Stark">
          </div>
        </div>

        <div class="field-wrap">
          <label>Email Address</label>
          <input type="email" class="field-input" id="f-email" value="${selections.email}" placeholder="tony@pumeon.net">
        </div>

        <div class="field-wrap">
          <label>Phone Number</label>
          <input type="tel" class="field-input" id="f-phone" value="${selections.phone}" placeholder="(555) 000-0000">
        </div>
        
        <p class="field-privacy">🔒 Your info is safe. We only use this data to generate your instant quote dashboard.</p>

        <div class="navrow">
          <button class="bbk" id="btn-back">← Back</button>
          <button class="bnxt" id="btn-next" ${validateForm() ? '' : 'disabled'}>Generate Dashboard</button>
        </div>
      </div>
    `;
    
    // Bind Realtime Form Field Validation Triggers
    ['f-fname','f-lname','f-email','f-phone'].forEach(id => {
      const el = document.getElementById(id);
      if(el) {
        el.addEventListener('input', () => {
          selections.firstName = document.getElementById('f-fname').value.trim();
          selections.lastName = document.getElementById('f-lname').value.trim();
          selections.email = document.getElementById('f-email').value.trim();
          selections.phone = document.getElementById('f-phone').value.trim();
          document.getElementById('btn-next').disabled = !validateForm();
        });
      }
    });

  } else {
    // Normal Standard Grid Selection Options Template View Router Block
    let currentKey = currentStep === 0 ? selections.type : (currentStep === 1 ? selections.hours : selections.date);
    
    let gridHTML = `<div class="ogrid">`;
    data.options.forEach(opt => {
      let activeClass = currentKey === opt.key ? "sel" : "";
      gridHTML += `
        <button class="obtn ${activeClass}" data-key="${opt.key}">
          <div class="omark">${currentKey === opt.key ? '✓' : ''}</div>
          <div class="otxt">
            <strong>${opt.title}</strong>
            <span>${opt.label}</span>
          </div>
        </button>
      `;
    });
    gridHTML += `</div>`;

    container.innerHTML = `
      <div class="step">
        <div class="slabel">${data.label}</div>
        <div class="sq">${data.title}</div>
        <div class="shint">${data.hint}</div>
        ${gridHTML}
        <div class="navrow">
          ${currentStep > 0 ? '<button class="bbk" id="btn-back">← Back</button>' : '<div></div>'}
          <button class="bnxt" id="btn-next" ${currentKey ? '' : 'disabled'}>Continue</button>
        </div>
      </div>
    `;

    // Bind Core Grid Selection Mouse Event Interceptors
    const buttons = container.querySelectorAll('.obtn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('sel'));
        buttons.forEach(b => b.querySelector('.omark').innerText = '');
        btn.classList.add('sel');
        btn.querySelector('.omark').innerText = '✓';
        
        let chosenKey = btn.getAttribute('data-key');
        if (currentStep === 0) selections.type = chosenKey;
        if (currentStep === 1) selections.hours = chosenKey;
        if (currentStep === 2) selections.date = chosenKey;
        
        document.getElementById('btn-next').disabled = false;
      });
    });
  }

  // Bind Standard Action Button Flow Listeners
  const backBtn = document.getElementById('btn-back');
  if(backBtn) {
    backBtn.addEventListener('click', () => {
      currentStep--;
      renderCurrentStep();
    });
  }

  document.getElementById('btn-next').addEventListener('click', () => {
    if (currentStep < totalSteps - 1) {
      currentStep++;
      renderCurrentStep();
    } else {
      triggerLoadingPipeline();
    }
  });
}

function validateForm() {
  return selections.firstName.length > 1 && 
         selections.lastName.length > 1 && 
         selections.email.includes('@') && 
         selections.phone.length > 5;
}

// Engine Simulator Orchestrating Async Calculations
function triggerLoadingPipeline() {
  document.getElementById('quiz-progress-section').style.display = 'none';
  const header = document.getElementById('quiz-header');
  header.querySelector('#hdr-title').innerText = "Compiling Production Estimates";
  header.querySelector('#hdr-sub').innerText = "Matching selections against live schedule data";

  const container = document.getElementById('step-view');
  container.innerHTML = `
    <div class="loading-wrap">
      <div class="loading-logo">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="40" fill="#3d5a6b" />
          <path d="M35 35 L65 50 L35 65 Z" fill="#4ecba0"/>
        </svg>
      </div>
      <div class="loading-text" id="l-txt">Reviewing calendar availability...</div>
      <div class="loading-bar-wrap"><div class="loading-bar" id="l-bar"></div></div>
      <div class="loading-sub">Usually takes 2-3 seconds</div>
    </div>
  `;

  let progress = 0;
  const bar = document.getElementById('l-bar');
  const txt = document.getElementById('l-txt');
  
  const timer = setInterval(() => {
    progress += 4;
    if(bar) bar.style.width = progress + "%";
    
    if (progress === 32) txt.innerText = "Applying seasonal package discounts...";
    if (progress === 64) txt.innerText = "Formatting localized option dashboard...";
    if (progress === 100) {
      clearInterval(timer);
      renderResultsDashboard();
    }
  }, 100);
}

// Final Dynamic Dashboard Generation Render Engine Template Block
function renderResultsDashboard() {
  const header = document.getElementById('quiz-header');
  header.querySelector('#hdr-title').innerText = "Your Custom Package Suite";
  header.querySelector('#hdr-sub').innerText = "Tailored to your target preferences and event architecture";

  // Calculation Parameter Config Logic Model Base Matrices
  let baseRate = 2400;
  if(selections.type === "wedding") baseRate = 3800;
  if(selections.type === "corporate") baseRate = 4500;

  let multiplier = 1;
  if(selections.hours === "8hr") multiplier = 1.4;
  if(selections.hours === "12hr") multiplier = 1.9;

  let priceCalculated = Math.round(baseRate * multiplier);

  const container = document.getElementById('step-view');
  container.innerHTML = `
    <div class="rwrap">
      <div class="reyebrow">Instant Match Dashboard</div>
      <h2 class="rhead">Hi ${selections.firstName}, here is your matched profile:</h2>
      <p class="rtag">Based on your answers, we recommend the customized package arrangement below.</p>

      <div class="price-estimate">
        <span class="pe-label">Estimated Production Base</span>
        <span class="pe-amount">$${priceCalculated.toLocaleString()}</span>
        <span class="pe-note">Comprehensive session curation & styling framework included</span>
      </div>

      <div class="summary-strip">
        <span class="sum-pill highlight">📍 Verified Match</span>
        <span class="sum-pill">⏱️ ${selections.hours === '4hr' ? '4 Hours' : (selections.hours === '8hr' ? '8 Hours' : '12 Hours')}</span>
        <span class="sum-pill">📅 Season: ${selections.date.toUpperCase()}</span>
      </div>

      <div class="pkcard rec">
        <div class="pkhdr">
          <div>
            <h3 class="pkname">Pumeon Signature Tier</h3>
            <div class="pkprice">$${(priceCalculated + 600).toLocaleString()} Premium Option</div>
            <div class="pksubtag">Our most popular tailored framework arrangement</div>
          </div>
          <span class="rbadge">Recommended</span>
        </div>
        <div class="pkbody">
          <ul class="pkinc">
            <li>High-fidelity multi-angle cinematic recording suites</li>
            <li>Master color grading profile optimization pass</li>
            <li>Digital master archive hosting vault with 10-year backup guarantee</li>
            <li>Comprehensive venue coordinate pre-scouting log assessment</li>
          </ul>
          
          <div class="pk-cta-hint">Click below to finalize project holds or check dates</div>
        </div>
      </div>

      <div class="testimonial">
        <div class="tst-stars">★★★★★</div>
        <p class="tst-text">"The customization engine built the perfect baseline profile for us. Tony checked out our details and matched everything cleanly!"</p>
        <p class="tst-author">— Sarah & Mark, June Event</p>
      </div>

      <div class="trust-block">
        <div class="trust-title">Why Pumeon Productions?</div>
        <div class="trust-grid">
          <div class="trust-item"><span class="trust-icon">⚡</span><span>Instant response timelines guaranteed</span></div>
          <div class="trust-item"><span class="trust-icon">🛡️</span><span>Fully licensed & professional backup grade arrays</span></div>
        </div>
      </div>

      <div class="hold-box">
        <div class="hold-title">Lock this baseline allocation rate?</div>
        <p class="hold-sub">Dates within your selection bracket are running at limited availability. Secure a soft booking hold instantly below.</p>
        <button class="ty-cal" id="btn-soft-hold" style="width:100%; text-align:center;">Secure My Booking Hold Now</button>
      </div>

      <button class="brst" id="btn-reset">↺ Start Over From Beginning</button>
    </div>
  `;

  document.getElementById('btn-reset').addEventListener('click', () => {
    location.reload();
  });

  document.getElementById('btn-soft-hold').addEventListener('click', () => {
    renderThankYouScreen();
  });
}

function renderThankYouScreen() {
  const header = document.getElementById('quiz-header');
  header.style.display = 'none';

  const container = document.getElementById('step-view');
  container.innerHTML = `
    <div class="ty-wrap">
      <div class="ty-icon">✓</div>
      <h2 class="ty-head">Soft Hold Confirmation</h2>
      <p class="ty-sub">Your configuration profiles have been locked into our availability framework cleanly.</p>
      
      <div class="ty-step"><span class="ty-num">1</span><span>We have dispatched a summary report to: <strong>${selections.email}</strong></span></div>
      <div class="ty-step"><span class="ty-num">2</span><span>Tony will follow up via phone at <strong>${selections.phone}</strong> within 24 hours</span></div>
      <div class="ty-step"><span class="ty-num">3</span><span>A standard 50% dynamic retainer locks your selected dates permanently</span></div>
      
      <div class="ty-actions">
        <a class="ty-cal" href="${BOOKING_URL}" target="_blank" rel="noopener">Book an instant Call on Calendly Instead</a>
        <div class="ty-social">
          <a class="social-link web" href="${WEBSITE}" target="_blank" rel="noopener">${iconGlobe()} Visit Website</a>
          <a class="social-link ig" href="${INSTAGRAM}" target="_blank" rel="noopener">${iconIG()} Follow Instagram</a>
        </div>
        <button class="back-results-btn" id="back-to-results">← Back to my results</button>
        <button class="ty-restart" id="ty-restart">Start over from beginning</button>
      </div>
    </div>
  `;

  document.getElementById('back-to-results').addEventListener('click', () => {
    renderResultsDashboard();
    document.getElementById('quiz-header').style.display = 'block';
  });

  document.getElementById('ty-restart').addEventListener('click', () => {
    location.reload();
  });
}

// Initial Boot Cycle
renderCurrentStep();
</script>
</body>
</html>
